sandbox_mode = "workspace-write"

# Keep MCP servers available but disabled by default. Enable one only for a task
# that needs it, so their tool schemas and startup logs do not bloat context.
[mcp_servers.svelte]
enabled = true
url = "https://mcp.svelte.dev/mcp"

[mcp_servers.context7]
enabled = false
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.chrome-devtools]
enabled = false
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[windows]
sandbox = "elevated"

[sandbox_workspace_write]
network_access = false
