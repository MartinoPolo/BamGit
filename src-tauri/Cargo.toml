[package]
name = "grovekeeper"
version = "0.1.0"
description = "Desktop agent orchestration GUI for parallel Claude Code sessions"
authors = ["MartinP"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grovekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
log = "0.4"
git2 = { version = "0.19", default-features = false }
thiserror = "2"
sysinfo = "0.32"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
portpicker = "0.1"
regex = "1"
walkdir = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

