name: CI

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

jobs:
    checks:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: '--max-old-space-size=4096'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/checkout@v4
              with:
                  repository: MartinoPolo/low-poly-2d-trees
                  path: low-poly-2d-trees-lib
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Build low-poly-2d-trees library
              run: cd low-poly-2d-trees-lib && pnpm install --frozen-lockfile && pnpm run package
            - name: Symlink library to expected path
              run: ln -s "${{ github.workspace }}/low-poly-2d-trees-lib" "${{ github.workspace }}/../low-poly-2d-trees"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check:all
            - name: Fallow health report (advisory)
              run: pnpm exec fallow health --score --summary
              continue-on-error: true
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run test -- --coverage
            - run: pnpm run test:e2e
