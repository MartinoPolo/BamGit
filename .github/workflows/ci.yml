name: CI

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

jobs:
    checks:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: '--max-old-space-size=4096'
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Clone and build low-poly-2d-trees library
              run: |
                  git clone --depth 1 https://github.com/MartinoPolo/low-poly-2d-trees.git ../low-poly-2d-trees
                  cd ../low-poly-2d-trees
                  pnpm install --frozen-lockfile
                  pnpm package
            - run: pnpm install --frozen-lockfile
            - run: pnpm check:all
            - name: Audit changed files for quality regressions
              if: github.event_name == 'pull_request'
              run: pnpm exec fallow audit --format json --quiet --explain --base origin/${{ github.base_ref }}
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test -- --coverage
            - run: pnpm e2e
