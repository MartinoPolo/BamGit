<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grovekeeper — Bottom Panel Session Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; }
</style>
</head>
<body class="theme-dark gk-root" data-theme="dark">
<div id="root"></div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark"
}/*EDITMODE-END*/;
</script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="session-shared.jsx"></script>
<script type="text/babel" src="bottom-panel-components.jsx"></script>

<script type="text/babel">

/*
  Bottom Panel — Session Tab — Design Exploration
  ─────────────────────────────────────────────────
  Three layout variants for the compact session view inside the bottom panel.
  Each takes a different approach to showing multiple sessions for one issue
  in a constrained vertical space (~300px).

  Assumptions & context:
  - The bottom panel sits below the issue main content area
  - It coexists with other tabs (terminal, output, etc.)
  - Dark theme is the primary mode for this dev tool
  - Panel height is user-resizable but designed for 250-350px
  - Sizing follows standardized controls: gk-btn-sm (26px), gk-badge (20px), gk-input (32px)

  Design decisions:
  - Compact message previews use 2-line clamp with -webkit-line-clamp
  - Earlier turns dimmed at 0.4 opacity, hover restores to 1.0
  - Tool calls rendered as 26px-high single-line entries (matches L1 36px standard scaled for panel)
  - Input always pinned to bottom of panel, never scrolls
  - "Open full session" link is always visible, never hidden
  - Status summary stays above the fold (no scroll needed)

  Next steps after variant selection:
  - Design all states (empty, single session, needs-input, errored, finished, minimized)
  - Needs-input approval card inline
  - Panel tab bar integration
*/

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const t = tweaks.theme;
    document.body.className = 'gk-root ' + (t === 'dark' ? 'theme-dark' : 'theme-light');
    document.body.setAttribute('data-theme', t);
  }, [tweaks.theme]);

  const panelW = 960;

  return (
    <>
      <DesignCanvas>
        <DCSection id="variants" title="Bottom Panel — Session Tab" subtitle="Three layout variants for the compact session view">

          <DCArtboard id="variant-a" label="A — Session tabs + truncated chat" width={panelW} height={BP_PANEL_HEIGHT + 4}>
            <VariantA/>
          </DCArtboard>

          <DCArtboard id="variant-b" label="B — Session selector + status-first" width={panelW} height={BP_PANEL_HEIGHT + 4}>
            <VariantB/>
          </DCArtboard>

          <DCArtboard id="variant-c" label="C — Split list + preview" width={panelW} height={BP_PANEL_HEIGHT + 4}>
            <VariantC/>
          </DCArtboard>

        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection title="Appearance">
          <TweakRadio
            label="Theme" value={tweaks.theme}
            options={[{ value: 'dark', label: 'Dark' }, { value: 'light', label: 'Light' }]}
            onChange={v => setTweak('theme', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
