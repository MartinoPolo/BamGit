<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grovekeeper — Issue Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-sans);
    background: oklch(0.135 0.020 150);
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
  }

  /* ────────────────────────────────────────────────────────
     Page chrome
     ──────────────────────────────────────────────────────── */
  .page { max-width: 1280px; margin: 0 auto; padding: 56px 40px 80px; }
  .page-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--moss-300);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .page-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.025em;
    color: var(--foreground);
    margin: 0 0 10px;
  }
  .page-lead {
    font-size: 14px;
    color: var(--foreground-muted);
    max-width: 720px;
    margin: 0 0 32px;
    line-height: 1.55;
  }
  .variant-block { margin-top: 56px; }
  .variant-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .variant-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moss-300);
    padding: 3px 8px;
    border: 1px solid color-mix(in oklch, var(--moss-400) 30%, transparent);
    border-radius: 4px;
    background: color-mix(in oklch, var(--moss-500) 8%, transparent);
  }
  .variant-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--foreground);
  }
  .variant-desc {
    font-size: 13px;
    color: var(--foreground-muted);
    margin: 8px 0 22px;
    max-width: 720px;
    line-height: 1.55;
  }
  .variant-meta {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--foreground-subtle);
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .variant-meta b { color: var(--foreground-muted); font-weight: 500; }

  .stack { display: flex; flex-direction: column; gap: 6px; }
  .stack-tight { display: flex; flex-direction: column; gap: 4px; }

  /* ────────────────────────────────────────────────────────
     Common badge / chip primitives used by all variants
     ──────────────────────────────────────────────────────── */
  .ic-mini-badge {
    display: inline-flex; align-items: center; gap: 4px;
    height: 18px; padding: 0 6px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 500;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--foreground-muted);
    white-space: nowrap;
    line-height: 1;
  }
  .ic-mini-badge.is-success { background: color-mix(in oklch, var(--status-success) 14%, transparent); color: var(--status-success); border-color: color-mix(in oklch, var(--status-success) 30%, transparent); }
  .ic-mini-badge.is-warn    { background: color-mix(in oklch, var(--status-warning) 14%, transparent); color: color-mix(in oklch, var(--status-warning) 65%, var(--foreground)); border-color: color-mix(in oklch, var(--status-warning) 30%, transparent); }
  .ic-mini-badge.is-danger  { background: color-mix(in oklch, var(--status-danger) 14%, transparent); color: var(--status-danger); border-color: color-mix(in oklch, var(--status-danger) 30%, transparent); }
  .ic-mini-badge.is-info    { background: color-mix(in oklch, var(--status-info) 14%, transparent); color: var(--status-info); border-color: color-mix(in oklch, var(--status-info) 30%, transparent); }
  .ic-mini-badge.is-purple  { background: color-mix(in oklch, oklch(0.660 0.180 320) 16%, transparent); color: oklch(0.760 0.180 320); border-color: color-mix(in oklch, oklch(0.660 0.180 320) 32%, transparent); }
  .ic-mini-badge.is-amber   { background: color-mix(in oklch, var(--accent) 16%, transparent); color: color-mix(in oklch, var(--accent) 70%, var(--foreground)); border-color: color-mix(in oklch, var(--accent) 32%, transparent); }
  .ic-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex-shrink: 0; }

  .ic-priority {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
  }
  .ic-priority::before { content: ""; width: 2px; height: 9px; background: currentColor; border-radius: 1px; }
  .ic-priority.p-critical { color: var(--status-danger); }
  .ic-priority.p-high     { color: oklch(0.770 0.155 65); }
  .ic-priority.p-low      { color: var(--status-info); }

  .ic-label-pill {
    display: inline-flex; align-items: center;
    height: 18px; padding: 0 7px;
    font-family: var(--font-sans);
    font-size: 10.5px;
    font-weight: 500;
    border-radius: 999px;
    line-height: 1;
    background: color-mix(in oklch, var(--lbl) 14%, transparent);
    color: color-mix(in oklch, var(--lbl) 75%, var(--foreground));
    border: 1px solid color-mix(in oklch, var(--lbl) 30%, transparent);
  }

  .ic-action-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; padding: 0 8px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--foreground);
    cursor: pointer;
    gap: 4px;
    transition: background 120ms, border-color 120ms;
  }
  .ic-action-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .ic-action-btn.is-primary { background: var(--moss-700); border-color: var(--moss-600); color: var(--moss-50); }
  .ic-action-btn.is-primary:hover { background: var(--moss-600); }
  .ic-action-btn.is-icon { width: 24px; padding: 0; color: var(--foreground-muted); }

  .ic-section-head {
    display: flex; align-items: baseline; gap: 12px;
    margin: 24px 0 12px;
  }
  .ic-section-title {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--foreground-subtle);
  }

  /* ════════════════════════════════════════════════════════
     VARIANT 1 — BANNER
     Solid colored header band across the top, full-width.
     Tree thumbnail tucks into the band; metadata is on a
     neutral surface body.
     ════════════════════════════════════════════════════════ */
  .v1-card {
    --ic: #525252;
    --ic-soft: color-mix(in oklch, var(--ic) 10%, transparent);
    position: relative;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: border-color 160ms, box-shadow 160ms, transform 160ms var(--ease-out);
  }
  .v1-card:hover { border-color: color-mix(in oklch, var(--ic) 35%, var(--border-strong)); box-shadow: var(--shadow-md); }

  .v1-banner {
    background: var(--ic);
    color: var(--ic-fg, #fff);
    padding: 10px 14px 10px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    position: relative;
  }
  .v1-banner-title-row {
    display: flex; align-items: baseline; gap: 8px; min-width: 0;
  }
  .v1-num {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    opacity: 0.7;
    letter-spacing: 0.01em;
  }
  .v1-name {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .v1-banner-right {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    opacity: 0.85;
  }
  .v1-banner-pri {
    display: inline-flex; align-items: center; gap: 4px;
    height: 18px; padding: 0 6px;
    border-radius: 4px;
    background: rgba(0,0,0,0.18);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 9.5px;
  }
  .v1-card[data-text-color="dark"] .v1-banner-pri { background: rgba(255,255,255,0.22); color: rgba(0,0,0,0.85); }

  .v1-body {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 12px;
    padding: 12px 14px 12px 12px;
    background:
      linear-gradient(180deg, var(--ic-soft) 0%, transparent 80%),
      var(--surface);
  }
  .v1-tree {
    width: 92px; height: 92px;
    border-radius: 8px;
    background: linear-gradient(180deg,
      color-mix(in oklch, var(--ic) 22%, var(--surface-2)) 0%,
      color-mix(in oklch, var(--ic) 6%, var(--surface-3)) 100%);
    border: 1px solid color-mix(in oklch, var(--ic) 25%, var(--border));
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .v1-tree-inner { transform: translateY(20px); }
  .v1-notify {
    position: absolute; top: 6px; right: 6px;
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--status-success);
    box-shadow: 0 0 0 0 currentColor;
    animation: ic-pulse-ring 1.6s ease-out infinite;
    color: var(--status-success);
  }
  .v1-notify.is-amber { background: var(--accent); color: var(--accent); }
  .v1-notify.is-danger { background: var(--status-danger); color: var(--status-danger); }
  @keyframes ic-pulse-ring {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 60%, transparent); }
    70%  { box-shadow: 0 0 0 6px color-mix(in oklch, currentColor 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 0%, transparent); }
  }

  .v1-meta { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .v1-branch-row {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--foreground-subtle);
    min-width: 0;
  }
  .v1-branch {
    color: var(--foreground-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .v1-badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

  .v1-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto;
    padding-top: 6px;
  }
  .v1-foot-spacer { flex: 1; }
  .v1-actions {
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 140ms;
  }
  .v1-card:hover .v1-actions, .v1-card[data-state="hover"] .v1-actions { opacity: 1; }

  /* ════════════════════════════════════════════════════════
     VARIANT 2 — SPINE
     Bold colored vertical spine on the left holding the tree
     thumbnail. The card body is neutral; color shows up as the
     thumbnail well + a tinted issue # chip.
     ════════════════════════════════════════════════════════ */
  .v2-card {
    --ic: #525252;
    position: relative;
    display: grid;
    grid-template-columns: 108px 1fr;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: border-color 160ms, box-shadow 160ms;
    min-height: 124px;
  }
  .v2-card:hover { border-color: color-mix(in oklch, var(--ic) 38%, var(--border-strong)); box-shadow: var(--shadow-md); }

  .v2-spine {
    background:
      radial-gradient(120% 80% at 50% 110%, color-mix(in oklch, var(--ic) 65%, black) 0%, var(--ic) 60%, color-mix(in oklch, var(--ic) 88%, black) 100%);
    color: var(--ic-fg, #fff);
    padding: 10px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .v2-spine::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.10) 0%,
      transparent 30%,
      transparent 70%,
      rgba(0,0,0,0.10) 100%);
    pointer-events: none;
  }
  .v2-spine-num {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0.82;
    z-index: 1;
  }
  .v2-tree-well {
    width: 88px; height: 88px;
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 1;
    position: relative;
  }
  .v2-tree-well .v2-tree-inner { transform: translateY(18px); }
  .v2-spine-stage {
    font-family: var(--font-mono);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.7;
    z-index: 1;
  }

  .v2-body {
    padding: 12px 14px 12px;
    display: flex; flex-direction: column; gap: 8px;
    min-width: 0;
  }
  .v2-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .v2-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.3;
    color: var(--foreground);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex: 1;
  }
  .v2-meta-row {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--foreground-subtle);
  }
  .v2-branch { color: var(--foreground-muted); }
  .v2-badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .v2-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto;
  }
  .v2-actions {
    margin-left: auto;
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 140ms;
  }
  .v2-card:hover .v2-actions { opacity: 1; }
  .v2-issue-chip {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    height: 18px;
    padding: 0 6px;
    border-radius: 4px;
    display: inline-flex; align-items: center;
    background: color-mix(in oklch, var(--ic) 18%, transparent);
    color: color-mix(in oklch, var(--ic) 80%, var(--foreground));
    border: 1px solid color-mix(in oklch, var(--ic) 30%, transparent);
  }

  /* ════════════════════════════════════════════════════════
     VARIANT 3 — CANOPY
     Color washes the entire body with a vivid color-tinted
     gradient. The tree blends in and the card itself becomes
     the color identifier. Most maximal; trades chrome for color.
     ════════════════════════════════════════════════════════ */
  .v3-card {
    --ic: #525252;
    --ic-fg: #fff;
    position: relative;
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 0;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(135deg, color-mix(in oklch, var(--ic) 96%, black) 0%, color-mix(in oklch, var(--ic) 70%, black) 100%);
    color: var(--ic-fg);
    overflow: hidden;
    box-shadow: 0 1px 0 color-mix(in oklch, var(--ic) 50%, transparent),
                0 6px 18px -8px color-mix(in oklch, var(--ic) 60%, transparent),
                var(--shadow-sm);
    border: 1px solid color-mix(in oklch, var(--ic) 50%, transparent);
    transition: transform 160ms var(--ease-out), box-shadow 160ms;
    min-height: 116px;
  }
  .v3-card:hover {
    transform: translateY(-1px);
    box-shadow:
      0 1px 0 color-mix(in oklch, var(--ic) 60%, transparent),
      0 14px 32px -10px color-mix(in oklch, var(--ic) 70%, transparent),
      var(--shadow-md);
  }
  .v3-card[data-text-color="dark"] {
    color: rgba(0,0,0,0.86);
  }
  .v3-card::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 100% at 100% 0%, rgba(255,255,255,0.10), transparent 50%);
  }
  .v3-card[data-text-color="dark"]::before {
    background: radial-gradient(120% 100% at 100% 0%, rgba(255,255,255,0.30), transparent 60%);
  }

  .v3-tree-pane {
    width: 100px;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 8px 4px 4px;
    position: relative;
    background:
      radial-gradient(70% 70% at 50% 100%, color-mix(in oklch, var(--ic) 100%, black) 0%, transparent 70%);
  }
  .v3-tree-pane::after {
    content: "";
    position: absolute; right: 0; top: 12%; bottom: 12%;
    width: 1px;
    background: linear-gradient(180deg,
      transparent 0%,
      currentColor 50%,
      transparent 100%);
    opacity: 0.18;
  }
  .v3-tree-inner { transform: translateY(18px); }

  .v3-body { padding: 12px 14px 12px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .v3-top { display: flex; align-items: flex-start; gap: 8px; }
  .v3-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    opacity: 0.72;
    letter-spacing: 0.02em;
  }
  .v3-name {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.25;
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v3-name-row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .v3-branch {
    font-family: var(--font-mono);
    font-size: 10.5px;
    opacity: 0.72;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v3-badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 2px; }

  .v3-card .ic-mini-badge {
    background: rgba(255,255,255,0.14);
    color: inherit;
    border-color: rgba(255,255,255,0.20);
    backdrop-filter: blur(2px);
  }
  .v3-card[data-text-color="dark"] .ic-mini-badge {
    background: rgba(0,0,0,0.10);
    border-color: rgba(0,0,0,0.18);
  }
  .v3-card .ic-mini-badge .ic-dot { background: currentColor; }
  .v3-card .ic-label-pill {
    background: rgba(255,255,255,0.16);
    color: inherit;
    border-color: rgba(255,255,255,0.22);
  }
  .v3-card[data-text-color="dark"] .ic-label-pill {
    background: rgba(0,0,0,0.10);
    border-color: rgba(0,0,0,0.20);
  }

  .v3-foot {
    margin-top: auto;
    display: flex; align-items: center; gap: 8px;
    padding-top: 4px;
  }
  .v3-foot-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    opacity: 0.68;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .v3-actions {
    margin-left: auto;
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 140ms;
  }
  .v3-card:hover .v3-actions { opacity: 1; }
  .v3-card .ic-action-btn {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.22);
    color: inherit;
  }
  .v3-card .ic-action-btn:hover { background: rgba(255,255,255,0.24); }
  .v3-card[data-text-color="dark"] .ic-action-btn {
    background: rgba(0,0,0,0.10);
    border-color: rgba(0,0,0,0.20);
  }
  .v3-card[data-text-color="dark"] .ic-action-btn:hover { background: rgba(0,0,0,0.18); }

  /* Notes / annotations */
  .design-note {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed var(--border);
  }
  .design-note-item {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--foreground-subtle);
    line-height: 1.6;
  }
  .design-note-item b {
    display: block;
    color: var(--foreground-muted);
    font-weight: 600;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 10px;
  }

/* ─── Color utility (mirrors getContrastTextColor) ─────────── */
function relLum(hex) {
  const m = hex.replace('#','');
  const r = parseInt(m.slice(0,2),16) / 255;
  const g = parseInt(m.slice(2,4),16) / 255;
  const b = parseInt(m.slice(4,6),16) / 255;
  const f = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
function getContrastTextColor(hex) {
  return relLum(hex) > 0.45 ? '#000000' : '#ffffff';
}
function textColorMode(hex) {
  return relLum(hex) > 0.45 ? 'dark' : 'light';
}

/* Map any hex into a "tree canopy" tint by extracting hue and
   pushing it toward natural foliage chroma/lightness */
function hexToOklch(hex) {
  // Quick HSL-ish hue extraction is enough for our purposes
  const m = hex.replace('#','');
  const r = parseInt(m.slice(0,2),16) / 255;
  const g = parseInt(m.slice(2,4),16) / 255;
  const b = parseInt(m.slice(4,6),16) / 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0;
  if (max !== min) {
    const d = max - min;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return h;
}

function PRBadge({ state }) {

    merged:             { tone: 'is-purple',  label: 'merged' },
    closed:             { tone: 'is-danger',  label: 'closed' },
    'ready-to-merge':   { tone: 'is-amber',   label: 'ready' },
  }[state] || { tone: '', label: 'pr' };
  return (
    <span className={`ic-mini-badge ${cfg.tone}`}>
      <I.GitPull size={10} sw={1.8} />
      {cfg.label}
    </span>
  );
}

function IssueStateBadge({ state, num }) {

  return (
    <span className={`ic-mini-badge ${isOpen ? 'is-success' : 'is-purple'}`}>

      #{num}

}

function PriorityChip({ priority }) {
  if (!priority || priority === 'medium' || priority === 'none') return null;
  const map = {
    critical: { cls: 'p-critical', label: 'Critical' },
    high:     { cls: 'p-high',     label: 'High' },
    low:      { cls: 'p-low',      label: 'Low' },
  };
  const c = map[priority];
  return <span className={`ic-priority ${c.cls}`}>{c.label}</span>;
}

function ChildChip({ count }) {

  return (
    <span className="ic-mini-badge">
      <I.Layers size={9} sw={1.8} />
      {count} sub
    </span>

}

function LabelPill({ name, color }) {
  return (
    <span className="ic-label-pill" style={{ '--lbl': color }}>

}

function BranchStatusBadge({ status }) {
  const map = {
    'active':      { tone: 'is-success', label: 'active' },
    'local-only':  { tone: 'is-info',    label: 'local' },
    'remote-gone': { tone: 'is-warn',    label: 'remote gone' },
    'deleted':     { tone: 'is-danger',  label: 'deleted' },

function SyncBadge({ behind }) {
  if (!behind) return null;

}

function ConflictBadge({ on }) {

/* ─── Issue → tree shape mapping (deterministic) ──────────── */
function pickShape(seed) {
  return ['oak','maple','birch','baobab'][seed % 4];
}

/* ─── Page ─────────────────────────────────────────────────── */
function Page() {
  return (
    <div className="page">
      <div className="page-eyebrow">Component design / Issue Card</div>
      <h1 className="page-title">Issue Card — three variants</h1>
      <p className="page-lead">
        The issue card is the atomic unit of the dashboard. Each issue carries a user-assigned
        color from a 24-color palette — that color is the primary cue for distinguishing one issue
        from another at a glance. Below are three takes on how prominently to surface that color,
        each balanced against the rest of the metadata. All variants pull text contrast from
        WCAG luminance and use the existing tree thumbnail.
      </p>

      {/* ───── Variant 1 ───── */}
      <section className="variant-block">
        <div className="variant-head">
          <span className="variant-tag">V1</span>
          <span className="variant-name">Banner</span>
        </div>
        <p className="variant-desc">
          A solid color banner runs across the top of the card holding the issue name and number.
          The body sits on a neutral surface lightly tinted by the issue color. Color reads strong
          but is contained — text contrast is automatic. Best when issues need to feel like
          discrete, well-organized rows.
        </p>
        <div className="variant-meta">
          <span><b>Header:</b> solid color band, full-width</span>
          <span><b>Body:</b> 8% color tint over surface</span>
          <span><b>Tree well:</b> color-tinted gradient</span>
          <span><b>Actions:</b> reveal on hover, in body</span>
        </div>
        <div className="list-stack">
          {ISSUES.map(issue => <IssueCardV1 key={issue.num} {...issue} />)}
        </div>
      </section>

        <div className="variant-head">
          <span className="variant-tag">V2</span>
          <span className="variant-name">Spine</span>

        <p className="variant-desc">

          number and stage label live on the spine in the contrast-aware text color. The card body
          stays on a neutral surface so dense metadata reads cleanly. Most information-dense.
        </p>
        <div className="variant-meta">
          <span><b>Spine:</b> 108px, gradient toward darker color</span>
          <span><b>Body:</b> neutral surface</span>
          <span><b>Issue # placement:</b> on the spine</span>
          <span><b>Stage:</b> overt as a footer caption</span>
        </div>
        <div className="list-stack">

          <span className="variant-name">Canopy</span>
        </div>
        <p className="variant-desc">

          and actions float on the color using glassy translucent surfaces — the card itself is the
          color. Highest visual energy, ideal for scanning short lists where color identity matters
          most. Trades absolute legibility against high-saturation custom colors for unmistakable
          identification.
        </p>
        <div className="variant-meta">
          <span><b>Body:</b> full color diagonal gradient</span>
          <span><b>Badges:</b> translucent glass on color</span>
          <span><b>Tree pane:</b> recessed, deeper color</span>
          <span><b>Text:</b> auto black/white via WCAG</span>
        </div>
        <div className="list-stack">
