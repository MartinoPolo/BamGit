<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grovekeeper — Issue Card v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-sans);
    background: oklch(0.135 0.020 150);
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Page chrome ────────────────────────────────────────── */
  .page { max-width: 1280px; margin: 0 auto; padding: 56px 40px 80px; }
  .page-eyebrow { font-family: var(--font-mono); font-size: 11px; color: var(--moss-300); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .page-title { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; color: var(--foreground); margin: 0 0 10px; }
  .page-lead { font-size: 14px; color: var(--foreground-muted); max-width: 720px; margin: 0 0 32px; line-height: 1.55; }
  .variant-block { margin-top: 56px; }
  .variant-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .variant-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--moss-300); padding: 3px 8px; border: 1px solid color-mix(in oklch, var(--moss-400) 30%, transparent); border-radius: 4px; background: color-mix(in oklch, var(--moss-500) 8%, transparent); }
  .variant-name { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--foreground); }
  .variant-desc { font-size: 13px; color: var(--foreground-muted); margin: 8px 0 22px; max-width: 720px; line-height: 1.55; }
  .variant-meta { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10.5px; color: var(--foreground-subtle); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
  .variant-meta b { color: var(--foreground-muted); font-weight: 500; }
  .list-stack { display: flex; flex-direction: column; gap: 6px; max-width: 620px; }
  .design-note { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; padding-top: 18px; border-top: 1px dashed var(--border); }
  .design-note-item { font-family: var(--font-mono); font-size: 10.5px; color: var(--foreground-subtle); line-height: 1.6; }
  .design-note-item b { display: block; color: var(--foreground-muted); font-weight: 600; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }

  /* ── Shared badge / chip primitives ─────────────────────── */
  .ic-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex-shrink: 0; }
  .ic-mini-badge {
    display: inline-flex; align-items: center; gap: 4px;
    height: 18px; padding: 0 6px;
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
    border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--foreground-muted);
    white-space: nowrap; line-height: 1; cursor: default;
  }
  .ic-mini-badge.is-success { background: color-mix(in oklch, var(--status-success) 14%, transparent); color: var(--status-success); border-color: color-mix(in oklch, var(--status-success) 30%, transparent); }
  .ic-mini-badge.is-warn    { background: color-mix(in oklch, var(--status-warning) 14%, transparent); color: color-mix(in oklch, var(--status-warning) 65%, var(--foreground)); border-color: color-mix(in oklch, var(--status-warning) 30%, transparent); }
  .ic-mini-badge.is-danger  { background: color-mix(in oklch, var(--status-danger) 14%, transparent); color: var(--status-danger); border-color: color-mix(in oklch, var(--status-danger) 30%, transparent); }
  .ic-mini-badge.is-info    { background: color-mix(in oklch, var(--status-info) 14%, transparent); color: var(--status-info); border-color: color-mix(in oklch, var(--status-info) 30%, transparent); }
  .ic-mini-badge.is-purple  { background: color-mix(in oklch, oklch(0.660 0.180 320) 16%, transparent); color: oklch(0.760 0.180 320); border-color: color-mix(in oklch, oklch(0.660 0.180 320) 32%, transparent); }
  .ic-mini-badge.is-amber   { background: color-mix(in oklch, var(--accent) 16%, transparent); color: color-mix(in oklch, var(--accent) 70%, var(--foreground)); border-color: color-mix(in oklch, var(--accent) 32%, transparent); }
  .ic-mini-badge.is-moss    { background: color-mix(in oklch, var(--primary) 14%, transparent); color: var(--primary); border-color: color-mix(in oklch, var(--primary) 30%, transparent); }

  .ic-label-pill {
    display: inline-flex; align-items: center;
    height: 18px; padding: 0 7px;
    font-family: var(--font-sans); font-size: 10.5px; font-weight: 500;
    border-radius: 999px; line-height: 1;
    background: color-mix(in oklch, var(--lbl) 14%, transparent);
    color: color-mix(in oklch, var(--lbl) 75%, var(--foreground));
    border: 1px solid color-mix(in oklch, var(--lbl) 30%, transparent);
  }

  .ic-priority {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
  }
  .ic-priority::before { content: ""; width: 2px; height: 9px; background: currentColor; border-radius: 1px; }
  .ic-priority.p-critical { color: var(--status-danger); }
  .ic-priority.p-high     { color: oklch(0.770 0.155 65); }
  .ic-priority.p-low      { color: var(--status-info); }

  .ic-action-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 22px; padding: 0 7px; gap: 4px;
    font-family: var(--font-sans); font-size: 11px; font-weight: 500;
    border-radius: 5px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--foreground);
    cursor: pointer; transition: background 120ms, border-color 120ms;
  }
  .ic-action-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .ic-action-btn.is-primary { background: var(--moss-700); border-color: var(--moss-600); color: var(--moss-50); }
  .ic-action-btn.is-primary:hover { background: var(--moss-600); }
  .ic-action-btn.is-icon { width: 22px; padding: 0; color: var(--foreground-muted); }

  @keyframes ic-pulse-ring {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 60%, transparent); }
    70%  { box-shadow: 0 0 0 5px color-mix(in oklch, currentColor 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 0%, transparent); }
  }

  /* ════════════════════════════════════════════════════════
     V1 — BANNER (refined)
     Color header band, tighter body with 3 distinct info rows:
     branch+worktree, state badges, github labels.
     ════════════════════════════════════════════════════════ */
  .v1-card {
    --ic: #525252;
    --ic-soft: color-mix(in oklch, var(--ic) 8%, transparent);
    position: relative;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: border-color 160ms, box-shadow 160ms, transform 160ms var(--ease-out);
  }
  .v1-card:hover {
    border-color: color-mix(in oklch, var(--ic) 35%, var(--border-strong));
    box-shadow: var(--shadow-md);
  }

  /* Header band */
  .v1-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px;
    background: var(--ic);
    color: var(--ic-fg, #fff);
    gap: 10px;
    min-height: 32px;
  }
  .v1-header-left {
    display: flex; align-items: baseline; gap: 7px;
    min-width: 0; flex: 1;
  }
  .v1-num {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    opacity: 0.72; letter-spacing: 0.01em; flex-shrink: 0;
  }
  .v1-name {
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .v1-header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .v1-pri-chip {
    display: inline-flex; align-items: center; gap: 3px;
    height: 18px; padding: 0 6px; border-radius: 4px;
    background: rgba(0,0,0,0.18);
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .v1-card[data-text-color="dark"] .v1-pri-chip { background: rgba(255,255,255,0.22); color: rgba(0,0,0,0.8); }
  .v1-child-chip {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: var(--font-mono); font-size: 10px; opacity: 0.72;
  }

  /* Body: tree | info */
  .v1-body {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 10px;
    padding: 10px 12px 10px 10px;
    align-items: start;
  }

  .v1-tree {
    width: 72px; height: 72px;
    border-radius: 7px;
    background: linear-gradient(180deg,
      color-mix(in oklch, var(--ic) 18%, var(--surface-2)) 0%,
      color-mix(in oklch, var(--ic) 5%, var(--surface-3)) 100%);
    border: 1px solid color-mix(in oklch, var(--ic) 20%, var(--border));
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden; position: relative; flex-shrink: 0;
  }
  .v1-tree-inner { transform: translateY(16px); }
  .v1-notify {
    position: absolute; top: 5px; right: 5px;
    width: 7px; height: 7px; border-radius: 999px;
    animation: ic-pulse-ring 1.6s ease-out infinite;
  }
  .v1-notify.is-success { background: var(--status-success); color: var(--status-success); }
  .v1-notify.is-amber   { background: var(--accent); color: var(--accent); }
  .v1-notify.is-danger  { background: var(--status-danger); color: var(--status-danger); }

  .v1-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  /* Row 1: branch + worktree status */
  .v1-branch-row {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; color: var(--foreground-subtle);
    min-width: 0;
  }
  .v1-branch {
    color: var(--foreground-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex: 1;
  }
  .v1-no-branch { opacity: 0.55; font-style: normal; }

  /* Row 2: state badges — issue, PR, sync, conflict */
  .v1-state-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

  /* Row 3: GitHub labels */
  .v1-labels-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

  /* Hover actions */
  .v1-actions {
    display: flex; gap: 3px; align-items: center;
    position: absolute; bottom: 8px; right: 10px;
    opacity: 0; transition: opacity 140ms;
  }
  .v1-card:hover .v1-actions { opacity: 1; }

  /* ════════════════════════════════════════════════════════
     V2 — SPINE (refined)
     Vertical spine on the left holds tree + number.
     Header row inside the body has name + priority.
     Same 3-row info split.
     ════════════════════════════════════════════════════════ */
  .v2-card {
    --ic: #525252;
    position: relative;
    display: grid;
    grid-template-columns: 80px 1fr;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: border-color 160ms, box-shadow 160ms;
  }
  .v2-card:hover {
    border-color: color-mix(in oklch, var(--ic) 38%, var(--border-strong));
    box-shadow: var(--shadow-md);
  }

  .v2-spine {
    background: radial-gradient(140% 80% at 50% 100%, color-mix(in oklch, var(--ic) 60%, black) 0%, var(--ic) 55%, color-mix(in oklch, var(--ic) 85%, black) 100%);
    color: var(--ic-fg, #fff);
    padding: 8px 6px 6px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; position: relative; overflow: hidden;
  }
  .v2-spine::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.12) 100%);
    pointer-events: none;
  }
  .v2-spine-num {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.04em; opacity: 0.82; z-index: 1;
  }
  .v2-tree-well {
    width: 68px; height: 68px;
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 1; position: relative;
  }
  .v2-tree-well .v2-tree-inner { transform: translateY(14px); }
  .v2-spine-stage {
    font-family: var(--font-mono); font-size: 8.5px; text-transform: uppercase;
    letter-spacing: 0.1em; opacity: 0.62; z-index: 1;
  }
  .v2-spine .v2-notify {
    position: absolute; top: 5px; right: 5px;
    width: 7px; height: 7px; border-radius: 999px;
    z-index: 2;
    animation: ic-pulse-ring 1.6s ease-out infinite;
  }
  .v2-notify.is-success { background: var(--status-success); color: var(--status-success); }
  .v2-notify.is-amber   { background: var(--accent); color: var(--accent); }
  .v2-notify.is-danger  { background: var(--status-danger); color: var(--status-danger); }

  .v2-body { padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  /* Name row */
  .v2-name-row {
    display: flex; align-items: baseline; gap: 8px;
  }
  .v2-name {
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3;
    color: var(--foreground); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Branch row */
  .v2-branch-row {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; color: var(--foreground-subtle);
    min-width: 0;
  }
  .v2-branch { color: var(--foreground-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .v2-no-branch { opacity: 0.55; }

  .v2-state-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .v2-labels-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

  .v2-actions {
    display: flex; gap: 3px; align-items: center;
    position: absolute; bottom: 7px; right: 10px;
    opacity: 0; transition: opacity 140ms;
  }
  .v2-card:hover .v2-actions { opacity: 1; }

  /* ════════════════════════════════════════════════════════
     V1b — BANNER COMPACT
     Like V1, but tree is inline with the header band itself —
     no separate tree well. Color header taller, tree peeks
     out the bottom. Even more compact for dense lists.
     ════════════════════════════════════════════════════════ */
  .v1b-card {
    --ic: #525252;
    position: relative;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: border-color 160ms, box-shadow 160ms;
  }
  .v1b-card:hover {
    border-color: color-mix(in oklch, var(--ic) 35%, var(--border-strong));
    box-shadow: var(--shadow-md);
  }

  .v1b-header {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 0 10px;
    align-items: center;
    padding: 0 12px 0 0;
    background: var(--ic);
    color: var(--ic-fg, #fff);
    min-height: 44px;
  }
  .v1b-tree-slot {
    width: 52px; height: 52px;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden; position: relative;
    background: rgba(0,0,0,0.12);
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .v1b-card[data-text-color="dark"] .v1b-tree-slot {
    background: rgba(255,255,255,0.12);
    border-right-color: rgba(0,0,0,0.08);
  }
  .v1b-tree-inner { transform: translateY(12px); }
  .v1b-notify {
    position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; border-radius: 999px;
    animation: ic-pulse-ring 1.6s ease-out infinite;
  }
  .v1b-notify.is-success { background: var(--status-success); color: var(--status-success); }
  .v1b-notify.is-amber   { background: var(--accent); color: var(--accent); }
  .v1b-notify.is-danger  { background: var(--status-danger); color: var(--status-danger); }

  .v1b-title-block { min-width: 0; padding: 6px 0; }
  .v1b-name {
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .v1b-sub {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10px; opacity: 0.68; margin-top: 2px;
  }

  .v1b-body { padding: 8px 12px 9px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .v1b-branch-row {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; color: var(--foreground-subtle);
    min-width: 0;
  }
  .v1b-branch { color: var(--foreground-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .v1b-state-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .v1b-labels-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .v1b-actions {
    display: flex; gap: 3px; align-items: center;
    position: absolute; bottom: 7px; right: 10px;
    opacity: 0; transition: opacity 140ms;
  }
  .v1b-card:hover .v1b-actions { opacity: 1; }
</style>
</head>
<body class="theme-dark gk-root">
<div id="root"></div>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="tree.jsx"></script>

<script type="text/babel" data-presets="env,react">

/* ─── Contrast helpers ─────────────────────────────────────── */
function relLum(hex) {
  const m = hex.replace('#','');
  const r = parseInt(m.slice(0,2),16) / 255;
  const g = parseInt(m.slice(2,4),16) / 255;
  const b = parseInt(m.slice(4,6),16) / 255;
  const f = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
function getContrastTextColor(hex) { return relLum(hex) > 0.45 ? '#000000' : '#ffffff'; }
function textColorMode(hex) { return relLum(hex) > 0.45 ? 'dark' : 'light'; }
function pickShape(seed) { return ['oak','maple','birch','baobab'][seed % 4]; }

/* ─── Badge sub-components ─────────────────────────────────── */
function PRBadge({ state }) {
  const cfg = {
    open:              { tone: 'is-success', label: 'PR open' },
    draft:             { tone: 'is-info',    label: 'PR draft' },
    'review-requested':{ tone: 'is-warn',    label: 'review' },
    approved:          { tone: 'is-amber',   label: 'approved' },
    merged:            { tone: 'is-purple',  label: 'merged' },
    closed:            { tone: 'is-danger',  label: 'closed' },
    'ready-to-merge':  { tone: 'is-amber',   label: 'ready' },
  }[state] || { tone: '', label: 'pr' };
  return <span className={`ic-mini-badge ${cfg.tone}`}><I.GitPull size={10} sw={1.8} />{cfg.label}</span>;
}

function IssueStateBadge({ state, num }) {
  const isOpen = state === 'open';
  return <span className={`ic-mini-badge ${isOpen ? 'is-success' : 'is-purple'}`}><span className="ic-dot" />#{num}</span>;
}

function PriorityChip({ priority }) {
  if (!priority || priority === 'medium' || priority === 'none') return null;
  const cls = { critical: 'p-critical', high: 'p-high', low: 'p-low' }[priority];
  return <span className={`ic-priority ${cls}`}>{priority}</span>;
}

function BranchStatusBadge({ status }) {
  const map = {
    active:      { tone: 'is-moss',   label: 'active' },
    'local-only':{ tone: 'is-info',    label: 'local' },
    'remote-gone':{ tone: 'is-warn',   label: 'remote gone' },
    deleted:     { tone: 'is-danger',  label: 'deleted' },
  };
  const c = map[status]; if (!c) return null;
  return <span className={`ic-mini-badge ${c.tone}`}><I.GitBranch size={9} sw={1.8} />{c.label}</span>;
}

function SyncBadge({ behind }) {
  if (!behind) return null;
  return <span className="ic-mini-badge is-warn"><I.Refresh size={9} sw={1.8} />{behind} behind</span>;
}

function ConflictBadge({ on }) {
  if (!on) return null;
  return <span className="ic-mini-badge is-danger"><I.AlertTriangle size={9} sw={1.8} />conflict</span>;
}

function ChildChip({ count }) {
  if (!count) return null;
  return <span className="ic-mini-badge"><I.Layers size={9} sw={1.8} />{count} sub</span>;
}

function LabelPill({ name, color }) {
  return <span className="ic-label-pill" style={{ '--lbl': color }}>{name}</span>;
}

/* ═══════════════════════════════════════════════════════════
   V1 — BANNER (refined)
   ═══════════════════════════════════════════════════════════ */
function IssueCardV1(props) {
  const {
    color = '#525252', name, num, branch, state = 'open', stage = 'leafy',
    pr, priority, labels = [], childCount = 0, behind = 0,
    branchStatus, conflict, notify, fruitCount = 0, season = 'summer', glow = false,
    seed = 1,
  } = props;
  const fg = getContrastTextColor(color);
  const mode = textColorMode(color);
  const shape = pickShape(seed);
  return (
    <div className="v1-card" style={{ '--ic': color, '--ic-fg': fg }} data-text-color={mode}>
      {/* Color header */}
      <div className="v1-header">
        <div className="v1-header-left">
          <span className="v1-num">#{num}</span>
          <span className="v1-name">{name}</span>
        </div>
        <div className="v1-header-right">
          {childCount > 0 && <span className="v1-child-chip"><I.Layers size={10} sw={1.8} />{childCount}</span>}
          {priority && priority !== 'medium' && priority !== 'none' && (
            <span className="v1-pri-chip">{priority}</span>
          )}
        </div>
      </div>

      {/* Body: tree + 3 info rows */}
      <div className="v1-body">
        <div className="v1-tree">
          <div className="v1-tree-inner">
            <Tree stage={stage} shape={shape} season={season} fruitCount={fruitCount} fruitType="apple" size={72} seed={seed} glow={glow} showGround={false} />
          </div>
          {notify && <span className={`v1-notify is-${notify}`} />}
        </div>
        <div className="v1-info">
          {/* Row 1: branch + worktree badges */}
          <div className="v1-branch-row">
            <I.GitBranch size={10} sw={1.8} />
            <span className={`v1-branch ${!branch ? 'v1-no-branch' : ''}`}>{branch || 'no worktree'}</span>
            <BranchStatusBadge status={branchStatus} />
            <SyncBadge behind={behind} />
            <ConflictBadge on={conflict} />
          </div>
          {/* Row 2: issue / PR state badges */}
          <div className="v1-state-row">
            <IssueStateBadge state={state} num={num} />
            {pr && <PRBadge state={pr} />}
          </div>
          {/* Row 3: GitHub labels (if any) */}
          {labels.length > 0 && (
            <div className="v1-labels-row">
              {labels.map(l => <LabelPill key={l.name} {...l} />)}
            </div>
          )}
        </div>
      </div>

      {/* Hover actions */}
      <div className="v1-actions">
        <button className="ic-action-btn is-primary"><I.Play size={9} sw={2} />Run</button>
        <button className="ic-action-btn"><I.Eye size={9} sw={1.8} />Review</button>
        <button className="ic-action-btn is-icon"><I.More size={10} /></button>
      </div>
    </div>
  );
}

/* ─── Page ─────────────────────────────────────────────────── */
function Page() {
  return (
    <div className="page">
      <div className="page-eyebrow">Component design / Issue Card — iteration 2</div>
      <h1 className="page-title">Issue Card — refined variants</h1>
      <p className="page-lead">
        Three takes on the issue card with tighter vertical space, split badge rows
        (branch + worktree state / issue + PR state / GitHub labels), and priority
        isolated in the header instead of mixed with labels. Cards are capped at 620px
        to show realistic proportions.
      </p>

      {/* ── V1 ── */}
      <section className="variant-block">
        <div className="variant-head">
          <span className="variant-tag">V1</span>
          <span className="variant-name">Banner</span>
        </div>
        <p className="variant-desc">
          Solid color header band holds issue name + number (left) and priority chip (right).
          Below, a 72px tree well sits next to three compact info rows: branch + worktree status,
          issue + PR state, and GitHub labels. The tree well is smaller than v1 — the header
          carries the color identity, not the thumbnail. Hover-revealed actions bottom-right.
        </p>
        <div className="variant-meta">
          <span><b>Header:</b> solid color, 32px</span>
          <span><b>Tree:</b> 72px well, tinted gradient</span>
          <span><b>Info rows:</b> branch · state · labels</span>
          <span><b>Priority:</b> header right</span>
        </div>
        <div className="list-stack">
          {ISSUES.map(issue => <IssueCardV1 key={issue.num} {...issue} />)}
        </div>
      </section>

      {/* ── V2 ── */}
      <section className="variant-block">
        <div className="variant-head">
          <span className="variant-tag">V2</span>
          <span className="variant-name">Spine</span>
        </div>
        <p className="variant-desc">
          80px vertical spine on the left holds issue number, tree (68px), and stage label in
          the issue color. The neutral body has name + priority on the first row, then the same
          three split info rows. No color wash on the body — clean readability. The spine is
          narrower than before to reduce visual weight while keeping color identifiable.
        </p>
        <div className="variant-meta">
          <span><b>Spine:</b> 80px, deep gradient</span>
          <span><b>Body:</b> neutral surface</span>
          <span><b>Info rows:</b> name · branch · state · labels</span>
          <span><b>Stage:</b> small caption at spine bottom</span>
        </div>
        <div className="list-stack">
          {ISSUES.map(issue => <IssueCardV2 key={issue.num} {...issue} />)}
        </div>
      </section>

      {/* ── V1b ── */}
      <section className="variant-block">
        <div className="variant-head">
          <span className="variant-tag">V1b</span>
          <span className="variant-name">Banner Compact</span>
        </div>
        <p className="variant-desc">
          A hybrid — the tree is embedded directly in the header band as a small 52px slot on the
          left edge, with name + number + priority filling the rest of the header. The body below
          is neutral and contains only the three badge rows with no tree. Most compact option;
          maximises vertical density for long issue lists.
        </p>
        <div className="variant-meta">
          <span><b>Header:</b> solid color, tree slot left, name right</span>
          <span><b>Tree:</b> 52px, inside header band</span>
          <span><b>Body:</b> badges only, neutral</span>
          <span><b>Density:</b> highest</span>
        </div>
        <div className="list-stack">
          {ISSUES.map(issue => <IssueCardV1b key={issue.num} {...issue} />)}
        </div>
      </section>

      {/* ── Design notes ── */}
      <div className="design-note" style={{ marginTop: 56 }}>
        <div className="design-note-item">
          <b>Split badge rows</b>
          Branch + worktree badges on one line. Issue + PR state on another. GitHub labels on a
          third. This prevents the "mixed badge soup" problem and makes each row scannable.
          Empty rows collapse (e.g., no labels = no third row).
        </div>
        <div className="design-note-item">
          <b>Priority in header</b>
          Priority is always in the header's right side — never mixed with status badges or labels.
          Medium and None are hidden. This keeps it visible at a glance without competing with
          the other metadata.
        </div>
        <div className="design-note-item">
          <b>Next steps</b>
          Pick a variant (or mix elements), then we design: collapsed/expanded toggle, all selection
          states (active, batch-selected, selection-ready hover), archived overlay, child indenting
          with connectors, narrow-width badge collapse, and context menu.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
